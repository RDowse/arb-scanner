name: arb-scanner

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arb
      POSTGRES_PASSWORD: arb
      POSTGRES_DB: arb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb -d arb"]
      interval: 2s
      timeout: 3s
      retries: 15

  detector:
    build:
      context: .
      dockerfile: Dockerfile
      target: detector
    image: arb-scanner-detector:local
    environment:
      DATABASE_URL: postgres://arb:arb@postgres:5432/arb?sslmode=disable
      ARB_CONFIG: /etc/arb-scanner/strategies.yaml
      LOG_LEVEL: info
    volumes:
      - ./config:/etc/arb-scanner:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-server
    image: arb-scanner-api:local
    environment:
      DATABASE_URL: postgres://arb:arb@postgres:5432/arb?sslmode=disable
      HTTP_ADDR: ":8080"
      MAX_FEED_AGE: 30s
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
