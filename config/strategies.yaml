config_id: v1

eval_interval: 1s

# Books older than this are not evaluated and the venue reports unhealthy.
max_book_age: 5s

venues:
  # Kraken REST: /0/public/Depth?pair=XBTUSD&count=20 (pair XBT, not BTC)
  - name: kraken
    taker_fee_bps: 26 # 0.26% taker, lowest 30d volume tier
    depth: 20
    poll_interval: 1s

  # Coinbase Exchange REST: /products/BTC-USD/book?level=2 (50 aggregated levels)
  - name: coinbase
    taker_fee_bps: 40 # 0.40% taker, lowest 30d volume tier
    depth: 20
    poll_interval: 1s

strategies:
  - name: cross_venue
    enabled: true
    venues: [kraken, coinbase]
    symbols:
      - BTC/USD
      - ETH/USD
    min_edge_bps: 5
    min_size_quote: 100

  - name: triangular
    enabled: false
    venues: [kraken]
    symbols:
      - BTC/USD
      - ETH/BTC
      - ETH/USD
    min_edge_bps: 5
    min_size_quote: 100
